name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # CI: Lint, type-check, and build (runs on every push and pull request)
  # ─────────────────────────────────────────────────────────────────────────
  ci:
    name: CI (lint + build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- Frontend ----------
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Type-check + build frontend
        working-directory: frontend
        env:
          # Build-time env. Real values come from secrets in the deploy job;
          # CI uses safe placeholders so type-check + bundling can succeed.
          VITE_API_BASE_URL: https://api.adepaporkhub.shop/api/v1
          VITE_PAYSTACK_PUBLIC_KEY: pk_test_ci_placeholder
        run: npm run build

      # ---------- Backend ----------
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        working-directory: backend
        run: composer validate --strict --no-check-publish

      - name: Install backend deps
        working-directory: backend
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev --optimize-autoloader

      - name: Lint PHP syntax
        working-directory: backend
        run: |
          find app config database routes -type f -name "*.php" \
            -exec php -l {} \; | grep -v "No syntax errors" || true

  # ─────────────────────────────────────────────────────────────────────────
  # Deploy: Push to Hostinger over SSH (only on push to main, after CI)
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Hostinger
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- Build frontend with production env ----------
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend (production)
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_PAYSTACK_PUBLIC_KEY: ${{ secrets.VITE_PAYSTACK_PUBLIC_KEY }}
          VITE_WHATSAPP_NUMBER: ${{ secrets.VITE_WHATSAPP_NUMBER }}
        run: npm run build

      # ---------- Set up SSH ----------
      # Manually write the key to a file so we control exactly how it's
      # stored. The shimataro action sometimes loses trailing newlines on
      # ed25519 keys, which causes "Permission denied (publickey)".
      - name: Install SSH key (manual)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write key. Force trailing newline; OpenSSH refuses keys without one.
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          # Strip CRLF if present (GitHub UI sometimes injects them)
          sed -i 's/\r$//' ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # SSH config with strict checking off
          cat > ~/.ssh/config <<EOF
          Host hostinger
            HostName ${{ secrets.HOSTINGER_SSH_HOST }}
            User ${{ secrets.HOSTINGER_SSH_USER }}
            Port ${{ secrets.HOSTINGER_SSH_PORT }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            BatchMode yes
            LogLevel ERROR
          EOF
          chmod 600 ~/.ssh/config

      - name: Validate SSH key format
        run: |
          echo "=== Key file size and header ==="
          wc -c ~/.ssh/deploy_key
          head -1 ~/.ssh/deploy_key
          tail -1 ~/.ssh/deploy_key
          echo "=== ssh-keygen verification ==="
          ssh-keygen -y -f ~/.ssh/deploy_key | head -c 80 && echo " (truncated)"

      - name: Test SSH connection
        run: ssh -vvv hostinger "echo Connected as \$(whoami) on \$(hostname)" 2>&1 | tail -40

      # ---------- Deploy frontend ----------
      # Sync dist/ into public_html/ but do NOT delete api/ (Laravel bridge)
      - name: Deploy frontend → public_html
        run: |
          rsync -avz --delete \
            --exclude='api/' \
            --exclude='.well-known/' \
            -e "ssh" \
            frontend/dist/ \
            hostinger:domains/adepaporkhub.shop/public_html/

      # ---------- Deploy backend ----------
      # Sync laravel code but preserve .env, storage uploads, and vendor.
      # vendor/ is rebuilt server-side via composer install.
      - name: Deploy backend → laravel/
        run: |
          rsync -avz --delete \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='vendor/' \
            --exclude='node_modules/' \
            --exclude='storage/app/public/*' \
            --exclude='storage/framework/cache/data/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/logs/*' \
            --exclude='bootstrap/cache/*.php' \
            --exclude='.git/' \
            --exclude='.github/' \
            -e "ssh" \
            backend/ \
            hostinger:domains/adepaporkhub.shop/laravel/

      # ---------- Run post-deploy commands on Hostinger ----------
      - name: Composer install + cache rebuild
        run: |
          ssh hostinger "cd domains/adepaporkhub.shop/laravel && \
             composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-req=php && \
             php artisan config:cache && \
             php artisan route:cache && \
             php artisan view:cache && \
             php artisan queue:restart"

      - name: Deploy summary
        run: |
          echo "::notice title=Deployed::Frontend → https://adepaporkhub.shop"
          echo "::notice title=Deployed::API → https://api.adepaporkhub.shop"
